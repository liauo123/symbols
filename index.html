<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7457e8">
  <title>注音符號歡樂遊戲</title>
  <style>
    :root {
      --purple: #7457e8;
      --purple-dark: #533bb7;
      --yellow: #ffd65a;
      --green: #39bd78;
      --red: #f0646c;
      --ink: #343150;
      --shadow: 0 9px 0 rgba(72,54,145,.15), 0 15px 30px rgba(72,54,145,.15);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      color: var(--ink);
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      background:
        radial-gradient(circle at 10% 13%, rgba(255,255,255,.72) 0 5%, transparent 5.2%),
        radial-gradient(circle at 90% 16%, rgba(255,222,113,.55) 0 7%, transparent 7.2%),
        linear-gradient(145deg, #e7ddff, #fff4ca 58%, #def8ed);
    }
    button { font: inherit; }
    .hidden { display: none !important; }
    .app {
      width: min(1000px, 100%);
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      margin: auto;
      padding: clamp(7px, 1.5vh, 18px) clamp(12px, 2.5vw, 28px) clamp(9px, 1.5vh, 20px);
      display: flex;
      flex-direction: column;
    }
    .app.wide { width: 100%; max-width: none; }
    .topbar {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      margin-bottom: clamp(6px, 1.2vh, 14px);
    }
    .title-wrap { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .mascot {
      width: clamp(44px, 6vh, 58px);
      height: clamp(44px, 6vh, 58px);
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 17px;
      background: #fff;
      box-shadow: 0 6px 0 rgba(116,87,232,.18);
      font-size: clamp(27px, 4vh, 35px);
      transform: rotate(-5deg);
    }
    h1 { margin: 0; color: var(--purple-dark); font-size: clamp(24px, 4vw, 39px); line-height: 1.1; }
    .subtitle { margin: 2px 0 0; color: #716b83; font-size: clamp(13px, 2vw, 17px); font-weight: 850; }
    .home-top {
      border: 3px solid #fff;
      border-radius: 999px;
      padding: 8px 14px;
      background: #fff;
      color: var(--purple-dark);
      font-weight: 950;
      cursor: pointer;
      box-shadow: 0 5px 0 rgba(83,59,183,.22);
      white-space: nowrap;
    }
    .home-top:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(83,59,183,.22); }
    .game-shell {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      border: 5px solid rgba(255,255,255,.92);
      border-radius: clamp(21px, 3vw, 33px);
      background: rgba(255,255,255,.84);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }
    .single-screen {
      height: 100%;
      min-height: 0;
      padding: clamp(8px, 1.5vh, 17px) clamp(10px, 2vw, 22px);
      display: flex;
      flex-direction: column;
      gap: clamp(5px, 1vh, 10px);
    }
    .status {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      font-weight: 950;
      font-size: clamp(14px, 2vw, 19px);
    }
    .status-center { text-align: center; color: var(--purple-dark); }
    .status-right { text-align: right; }
    .speak-btn {
      border: 0;
      border-radius: 16px;
      padding: 7px 16px;
      background: linear-gradient(145deg, #6fcb8e, #39a96d);
      color: #fff;
      font-weight: 950;
      cursor: pointer;
      box-shadow: 0 5px 0 #278856;
      touch-action: manipulation;
    }
    .progress-track { height: 11px; flex: 0 0 auto; overflow: hidden; border-radius: 999px; background: #e9e3ff; }
    .progress-bar { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #7d63ec, #c674e8); transition: width .35s ease; }
    .listen-grid {
      width: min(830px, 100%);
      margin: auto;
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      grid-template-rows: repeat(7, minmax(0, 1fr));
      gap: clamp(4px, .8vh, 8px) clamp(5px, 1vw, 9px);
    }
    .symbol-btn {
      min-width: 0;
      min-height: 0;
      border: 3px solid #fff;
      border-radius: clamp(10px, 1.7vw, 18px);
      background: var(--card, #ff817c);
      color: #fff;
      font-size: clamp(22px, 4.8vh, 49px);
      font-weight: 1000;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--shadow-card, #d95f64);
      touch-action: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .symbol-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--shadow-card); }
    .symbol-btn.correct { outline: 5px solid #33d585; animation: correctPulse .55s ease infinite alternate; }
    .symbol-btn.wrong { animation: shake .4s ease; filter: saturate(.35); }
    .message {
      min-height: 28px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      color: var(--purple-dark);
      text-align: center;
      font-size: clamp(15px, 2.3vw, 21px);
      font-weight: 950;
    }
    .match-grid {
      width: min(820px, 100%);
      margin: auto;
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      grid-template-rows: repeat(8, minmax(0, 1fr));
      gap: clamp(3px, .65vh, 7px);
    }
    .match-card {
      min-width: 0;
      min-height: 0;
      position: relative;
      border: 3px solid #fff;
      border-radius: clamp(7px, 1.2vw, 13px);
      background: #7b63df;
      color: #fff;
      font-size: clamp(17px, 4vh, 38px);
      font-weight: 1000;
      cursor: pointer;
      box-shadow: 0 4px 0 #5943b8;
      touch-action: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .match-card.selected {
      z-index: 2;
      outline: 5px solid #ff243f;
      outline-offset: 1px;
      box-shadow: 0 4px 0 #5943b8, 0 0 0 3px #fff, 0 0 15px rgba(255,36,63,.72);
    }
    .match-card.matched {
      background: #aaaeba;
      color: #f3f3f6;
      box-shadow: 0 4px 0 #7e8290;
      filter: saturate(.18);
      pointer-events: none;
      animation: vanishMatch .55s cubic-bezier(.3,.7,.3,1) forwards;
    }
    .pk-panel {
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 42px minmax(0, 1fr);
      gap: 6px;
      position: relative;
    }
    .pk-side {
      min-width: 0;
      min-height: 0;
      position: relative;
      padding: clamp(5px, .8vw, 10px);
      display: flex;
      flex-direction: column;
      gap: clamp(4px, .7vh, 7px);
      overflow: hidden;
      transition: filter .4s ease, transform .4s ease;
    }
    .pk-side:first-child { background: rgba(220,244,255,.5); }
    .pk-side:last-child { background: rgba(255,227,230,.46); }
    .pk-head {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 5px;
      font-size: clamp(12px, 1.5vw, 18px);
      font-weight: 950;
    }
    .pk-name { color: var(--purple-dark); font-size: clamp(14px, 1.8vw, 21px); }
    .pk-speak { grid-column: 1 / -1; justify-self: center; padding: 5px 12px; font-size: clamp(12px, 1.4vw, 16px); }
    .pk-message { min-height: 23px; font-size: clamp(11px, 1.4vw, 16px); }
    .pk-divider { position: relative; display: grid; place-items: center; }
    .pk-divider::before { content: ""; position: absolute; top: 2%; bottom: 2%; left: 50%; width: 5px; transform: translateX(-50%); border-radius: 999px; background: linear-gradient(#7557e8, #ff6c75); }
    .pk-divider span { z-index: 1; width: 40px; height: 40px; display: grid; place-items: center; border: 4px solid #fff; border-radius: 50%; background: #ffcf4f; color: #663b00; font-weight: 1000; }
    .pk-listen-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      grid-template-rows: repeat(7, minmax(0, 1fr));
      gap: clamp(2px, .45vh, 5px);
    }
    .pk-listen-grid .symbol-btn { border-width: 2px; border-radius: clamp(6px, .8vw, 11px); font-size: clamp(16px, 3.7vh, 34px); box-shadow: 0 3px 0 var(--shadow-card); }
    .pk-match-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      grid-template-rows: repeat(8, minmax(0, 1fr));
      gap: clamp(2px, .4vh, 5px);
    }
    .pk-match-grid .match-card { border-width: 2px; border-radius: clamp(4px, .65vw, 9px); font-size: clamp(13px, 3.3vh, 30px); box-shadow: 0 3px 0 #5943b8; }
    .pk-side.loser { filter: brightness(.3) saturate(.3); pointer-events: none; }
    .pk-side.winner { transform: scale(.995); box-shadow: inset 0 0 0 7px #ffd44f, inset 0 0 40px rgba(255,205,55,.55); }
    .winner-banner {
      position: absolute;
      z-index: 12;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(82%, 340px);
      padding: 18px 10px;
      border: 5px solid #fff;
      border-radius: 25px;
      background: linear-gradient(145deg, #ffe76c, #ff9a68);
      color: #693a00;
      text-align: center;
      font-size: clamp(27px, 4vw, 48px);
      font-weight: 1000;
      box-shadow: 0 15px 44px rgba(100,55,0,.4);
      animation: winnerPop .8s ease both, winnerGlow .9s ease-in-out .8s infinite alternate;
    }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 12px;
      overflow-y: auto;
      background: rgba(62,47,117,.43);
      backdrop-filter: blur(6px);
    }
    .modal {
      width: min(620px, 100%);
      max-height: calc(100dvh - 24px);
      overflow-y: auto;
      padding: clamp(17px, 3vh, 30px) 24px;
      border: 5px solid #fff;
      border-radius: 31px;
      background: linear-gradient(145deg, #fffdf5, #f1ebff);
      text-align: center;
      box-shadow: 0 20px 70px rgba(50,35,110,.35);
      animation: pop .4s cubic-bezier(.2,1.5,.45,1);
    }
    .modal-icon { font-size: clamp(48px, 8vh, 76px); }
    .modal-icon.title-icon {
      color: var(--purple-dark);
      font-size: clamp(30px, 6vw, 50px);
      font-weight: 1000;
      letter-spacing: .08em;
    }
    .modal h2 { margin: 5px 0; color: var(--purple-dark); font-size: clamp(28px, 6vw, 44px); }
    .modal p { margin: 7px 0 17px; font-size: clamp(15px, 2.2vw, 18px); font-weight: 800; }
    .mode-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
    .mode-btn {
      min-height: 118px;
      padding: 13px 9px;
      border: 4px solid #fff;
      border-radius: 23px;
      color: #fff;
      font-weight: 950;
      cursor: pointer;
      box-shadow: 0 7px 0 rgba(70,49,143,.3);
    }
    .mode-btn:nth-child(1) { background: linear-gradient(145deg, #62ce8a, #35a96a); }
    .mode-btn:nth-child(2) { background: linear-gradient(145deg, #9475ed, #6549c7); }
    .mode-btn:nth-child(3) { background: linear-gradient(145deg, #50bced, #257dc3); }
    .mode-btn:nth-child(4) { background: linear-gradient(145deg, #ff8b69, #e65666); }
    .mode-btn:nth-child(5) { background: linear-gradient(145deg, #ffb849, #ed7e28); }
    .mode-btn:nth-child(6) { background: linear-gradient(145deg, #f16fb0, #bd4bcc); }
    .mode-icon { display: block; margin-bottom: 4px; font-size: 35px; }
    .mode-name { display: block; font-size: clamp(17px, 2.5vw, 22px); }
    .mode-desc { display: block; margin-top: 4px; font-size: 13px; opacity: .95; }
    .finish-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .action-btn {
      border: 0;
      border-radius: 17px;
      padding: 10px 23px;
      background: var(--purple);
      color: #fff;
      font-size: 19px;
      font-weight: 950;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--purple-dark);
    }
    .action-btn.light { border: 3px solid var(--purple); background: #fff; color: var(--purple-dark); box-shadow: 0 5px 0 #d8cff8; }
    .countdown {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: rgba(48,34,102,.68);
      backdrop-filter: blur(5px);
    }
    .count-number {
      width: clamp(135px, 20vw, 220px);
      height: clamp(135px, 20vw, 220px);
      display: grid;
      place-items: center;
      border: 9px solid #fff;
      border-radius: 50%;
      background: linear-gradient(145deg, #8b6df0, #ff7979);
      color: #fff;
      font-size: clamp(68px, 12vw, 120px);
      font-weight: 1000;
      box-shadow: 0 18px 70px rgba(35,20,90,.5);
      animation: countdownPop .9s ease infinite;
    }
    .count-number.start {
      width: auto;
      height: auto;
      min-width: min(70vw, 600px);
      padding: 26px 70px;
      border-color: #ffd3c6;
      border-radius: 33px;
      background: linear-gradient(145deg, #fff8f2, #ffe3d6);
      color: #ff836c;
      font-size: clamp(67px, 11vw, 140px);
      letter-spacing: .12em;
      text-indent: .12em;
      white-space: nowrap;
    }
    /* 新增：多字語詞直式拼音遊戲 */
    .spell-screen { height: 100%; min-height: 0; padding: clamp(6px, 1vh, 11px); display: flex; flex-direction: column; gap: 6px; }
    .spell-status { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; font-size: clamp(13px, 1.8vw, 18px); font-weight: 950; }
    .spell-status > :last-child { text-align: right; }
    .spell-word { display: flex; justify-content: center; align-items: center; gap: 12px; padding: 5px 12px; border-radius: 17px; background: #eef0ff; color: #392a88; }
    .spell-icon { font-size: clamp(34px, 6vh, 58px); line-height: 1; }
    .spell-name { font-size: clamp(25px, 4vh, 42px); font-weight: 1000; letter-spacing: .14em; }
    .spell-audio { border: 0; border-radius: 13px; padding: 7px 12px; background: #6654d7; color: #fff; font-weight: 950; cursor: pointer; touch-action: manipulation; }
    .spell-char-area { display: flex; justify-content: center; gap: clamp(7px, 1.5vw, 18px); min-height: 0; }
    .spell-char { min-width: clamp(88px, 14vw, 132px); padding: 5px; border: 3px solid #f3cf68; border-radius: 15px; background: #fff9df; color: var(--ink); cursor: pointer; touch-action: manipulation; }
    .spell-char.active { border: 5px solid #f0444f; padding: 3px; background: #fff; box-shadow: 0 0 0 3px rgba(240,68,79,.16); }
    .spell-char-label { margin-bottom: 4px; color: #8d5413; font-size: clamp(15px, 2.2vw, 21px); font-weight: 1000; }
    .spell-vertical { display: flex; justify-content: center; gap: 5px; }
    .spell-stack { display: flex; flex-direction: column; gap: 3px; }
    .spell-slot { width: clamp(31px, 4.5vh, 43px); height: clamp(31px, 4.5vh, 43px); display: grid; place-items: center; border: 2px solid #d5d8e5; border-radius: 8px; background: #fff; font-size: clamp(17px, 2.7vh, 25px); font-weight: 1000; }
    .spell-tone { width: clamp(31px, 4.5vh, 43px); display: grid; place-items: center; border: 2px solid #f2b945; border-radius: 8px; background: #fff0b8; font-size: clamp(20px, 3vh, 28px); font-weight: 1000; }
    .spell-keyboard { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: clamp(3px, .65vh, 7px); overflow: hidden; }
    .spell-key-row { display: grid; grid-template-columns: 58px minmax(0, 1fr); align-items: center; gap: 7px; }
    .spell-key-label { color: #706a83; font-size: clamp(12px, 1.8vh, 16px); font-weight: 950; text-align: right; white-space: nowrap; }
    .spell-key-list { display: grid; justify-content: center; gap: clamp(3px, .55vw, 7px); }
    .spell-key-row[data-key-group="sheng"] .spell-key-list { grid-template-columns: repeat(13, minmax(35px, 48px)); grid-template-rows: repeat(2, auto); }
    .spell-key-row[data-key-group="jie"] .spell-key-list { grid-template-columns: repeat(3, minmax(54px, 76px)); }
    .spell-key-row[data-key-group="yun"] .spell-key-list { grid-template-columns: repeat(13, minmax(35px, 48px)); }
    .spell-key-row[data-key-group="tone"] .spell-key-list { grid-template-columns: repeat(5, minmax(78px, 112px)); }
    .spell-key { width: 100%; height: clamp(34px, 4.8vh, 48px); padding: 0 6px; border: 2px solid currentColor; border-radius: 11px; font-size: clamp(17px, 2.7vh, 24px); font-weight: 1000; cursor: pointer; touch-action: none; }
    .spell-key[data-spell-type="sheng"] { color: #c52c78; background: #ffe3f1; }
    .spell-key[data-spell-type="jie"] { color: #1276ad; background: #def4ff; }
    .spell-key[data-spell-type="yun"] { color: #13815e; background: #dcfaed; }
    .spell-key[data-spell-type="tone"] { color: #9a5b0c; background: #fff2bd; font-size: clamp(12px, 2vh, 17px); }
    .spell-actions { display: grid; grid-template-columns: auto minmax(130px, 260px); justify-content: center; gap: 8px; }
    .spell-clear, .spell-submit { border: 0; border-radius: 12px; padding: 8px 15px; color: #fff; font-weight: 950; cursor: pointer; touch-action: manipulation; }
    .spell-clear { background: #9198aa; }
    .spell-submit { background: #25ad72; }
    .spell-feedback { min-height: 24px; color: var(--purple-dark); text-align: center; font-size: clamp(13px, 2vw, 18px); font-weight: 950; }
    .spell-pk { height: 100%; min-height: 0; position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 42px minmax(0, 1fr); gap: 5px; }
    .spell-pk-side { min-width: 0; min-height: 0; padding: clamp(78px, 11vh, 102px) 7px 7px; display: flex; flex-direction: column; gap: 5px; overflow: hidden; transition: filter .4s, box-shadow .4s; }
    #spellPKLeft { background: rgba(220,244,255,.52); }
    #spellPKRight { background: rgba(255,227,230,.48); }
    .spell-pk-shared { position: absolute; z-index: 4; top: 5px; left: 50%; transform: translateX(-50%); width: min(600px, 62%); padding: 5px 12px; border: 4px solid #fff; border-radius: 20px; background: linear-gradient(145deg, #fff7d7, #eee9ff); box-shadow: 0 7px 20px rgba(63,47,130,.2); text-align: center; }
    .spell-pk-shared-status { color: #65558e; font-size: clamp(11px, 1.4vw, 15px); font-weight: 950; }
    .spell-pk-shared .spell-word { padding: 2px 7px; background: transparent; }
    .spell-pk-shared .spell-icon { font-size: clamp(30px, 5vh, 48px); }
    .spell-pk-shared .spell-name { font-size: clamp(25px, 3.5vw, 40px); }
    .spell-pk-shared .spell-audio { padding: 8px 14px; font-size: clamp(13px, 1.5vw, 17px); }
    .spell-pk-side .pk-head { font-size: clamp(17px, 1.8vw, 25px); }
    .spell-pk-side .pk-name { font-size: clamp(20px, 2vw, 29px); }
    .spell-pk-side .spell-char-area { gap: clamp(7px, 1vw, 13px); }
    .spell-pk-side .spell-char { min-width: clamp(100px, 10vw, 140px); padding: 7px; border-width: 4px; border-radius: 19px; }
    .spell-pk-side .spell-char.active { border-width: 6px; padding: 5px; }
    .spell-pk-side .spell-char-label { margin-bottom: 7px; font-size: clamp(21px, 2.2vw, 29px); }
    .spell-pk-side .spell-vertical { gap: 8px; }
    .spell-pk-side .spell-stack { gap: 5px; }
    .spell-pk-side .spell-slot { width: clamp(42px, 5.6vh, 58px); height: clamp(42px, 5.6vh, 58px); border-width: 2px; border-radius: 10px; font-size: clamp(22px, 3.2vh, 31px); }
    .spell-pk-side .spell-tone { width: clamp(42px, 5.6vh, 58px); border-width: 2px; border-radius: 10px; font-size: clamp(24px, 3.5vh, 34px); }
    .spell-pk-side .spell-keyboard { gap: 3px; }
    .spell-pk-side .spell-key-row { grid-template-columns: 45px minmax(0, 1fr); gap: 5px; }
    .spell-pk-side .spell-key-label { font-size: clamp(12px, 1.35vw, 17px); }
    .spell-pk-side .spell-key-list { gap: clamp(2px, .3vw, 5px); }
    .spell-pk-side .spell-key-row[data-key-group="sheng"] .spell-key-list { grid-template-columns: repeat(13, minmax(27px, 45px)); }
    .spell-pk-side .spell-key-row[data-key-group="jie"] .spell-key-list { grid-template-columns: repeat(3, minmax(58px, 94px)); }
    .spell-pk-side .spell-key-row[data-key-group="yun"] .spell-key-list { grid-template-columns: repeat(13, minmax(27px, 45px)); }
    .spell-pk-side .spell-key-row[data-key-group="tone"] .spell-key-list { grid-template-columns: repeat(5, minmax(66px, 105px)); }

        {id:17,name:'氣球',icon:'🎈',chars:[['氣','ㄑ','ㄧ','','四聲'],['球','ㄑ','ㄧ','ㄡ','二聲']]},
        {id:18,name:'電腦',icon:'💻',chars:[['電','ㄉ','ㄧ','ㄢ','四聲'],['腦','ㄋ','','ㄠ','三聲']]},
        {id:19,name:'兔子',icon:'🐰',chars:[['兔','ㄊ','ㄨ','','四聲'],['子','ㄗ','','','輕聲']]},
        {id:20,name:'太陽',icon:'☀️',chars:[['太','ㄊ','','ㄞ','四聲'],['陽','','ㄧ','ㄤ','二聲']]}
      ];

      let mode = 'listen';
      let audioCtx = null;
      let timers = [];
      let countdownTimer = null;
      let raceOver = false;
      let listenState = null;
      let matchState = null;
      let pkState = null;
      let spellState = null;
      let spellPKState = null;
      let spellVoiceRequest = 0;

      function shuffle(items) {
        const array = [...items];
        for (let index = array.length - 1; index > 0; index--) {
          const target = Math.floor(Math.random() * (index + 1));
          [array[index], array[target]] = [array[target], array[index]];
        }
        return array;
      }

      function randomSymbol(exclude = []) {
        const choices = SYMBOLS.filter(symbol => !exclude.includes(symbol));
        return choices[Math.floor(Math.random() * choices.length)];
      }

      function addTimer(callback, delay) {
        const timer = setTimeout(() => {
          timers = timers.filter(item => item !== timer);
          callback();
        }, delay);
        timers.push(timer);
        return timer;
      }

      function clearTimers() {
        timers.forEach(clearTimeout);
        timers = [];
        clearInterval(countdownTimer);
        countdownTimer = null;
      }

      function ensureAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      }

      function tone(frequency, duration, type = 'sine', volume = .18, delay = 0) {
        if (!audioCtx) return;
        const oscillator = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        oscillator.type = type;
        oscillator.frequency.value = frequency;
        gain.gain.setValueAtTime(volume, audioCtx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + delay + duration);
        oscillator.connect(gain).connect(audioCtx.destination);
        oscillator.start(audioCtx.currentTime + delay);
        oscillator.stop(audioCtx.currentTime + delay + duration);
      }

      function playSuccess() {
        tone(523, .2, 'triangle', .25, 0);
        tone(659, .2, 'triangle', .25, .13);
        tone(784, .3, 'triangle', .28, .26);
      }

      function playWrong() {
        tone(230, .18, 'sawtooth', .17, 0);
        tone(180, .22, 'sawtooth', .15, .12);
      }

      function preferredZhVoice() {
        if (!('speechSynthesis' in window)) return null;
        const voices = window.speechSynthesis.getVoices();
        return voices.find(voice => voice.lang.toLowerCase() === 'zh-tw') ||
          voices.find(voice => voice.lang.toLowerCase().startsWith('zh')) || null;
      }

      function speak(text, cancelFirst = true, onEnd = null) {
        if (!('speechSynthesis' in window)) {
          if (onEnd) onEnd();
          return;
        }
        if (cancelFirst) window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-TW';
        const voice = preferredZhVoice();
        if (voice) utterance.voice = voice;
        utterance.rate = .5;
        utterance.pitch = 1;
        utterance.volume = 1;
        if (onEnd) {
          let finished = false;
          const finish = () => {
            if (finished) return;
            finished = true;
            onEnd();
          };
          utterance.onend = finish;
          utterance.onerror = finish;
        }
        window.speechSynthesis.speak(utterance);
      }

      function speakSymbol(symbol) {
        const request = ++symbolVoiceRequest;
        const voiceNumber = symbol.codePointAt(0) - 0x3104;
        symbolVoiceAudio.pause();
        symbolVoiceAudio.src = `${FEMALE_AUDIO_BASE}F${voiceNumber}.WAV`;
        symbolVoiceAudio.load();
        speak('請找出。', true, () => {
          if (request !== symbolVoiceRequest) return;
          symbolVoiceAudio.currentTime = 0;
          symbolVoiceAudio.volume = 1;
          const playing = symbolVoiceAudio.play();
          if (playing) {
            playing.catch(() => speak(SYMBOL_SPEECH[symbol] || symbol));
          }
        });
      }

      function bindTap(element, handler) {
        let touchedAt = 0;
        element.addEventListener('pointerdown', event => {
          if (event.pointerType === 'touch' || event.pointerType === 'pen') {
            event.preventDefault();
            touchedAt = Date.now();
            handler(event);
          }
        });
        element.addEventListener('click', event => {
          if (event.detail !== 0 && Date.now() - touchedAt < 700) return;
          handler(event);
        });
      }

      function setCardColor(card, index) {
        const color = COLORS[index % COLORS.length];
        card.style.setProperty('--card', color[0]);
        card.style.setProperty('--shadow-card', color[1]);
      }

      function makeSymbolButton(symbol, index, handler) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'symbol-btn';
        button.textContent = symbol;
        button.setAttribute('aria-label', `注音 ${symbol}`);
        setCardColor(button, index);
        bindTap(button, () => handler(symbol, button));
        return button;
      }

      function showCelebration(text = '答對了！好棒！') {
        celebrate.querySelector('.cheer').textContent = text;
        celebrate.querySelectorAll('.confetti').forEach(item => item.remove());
        const colors = ['#ff6775','#ffd33d','#59c8ef','#62d792','#a37cf1'];
        for (let index = 0; index < 34; index++) {
          const bit = document.createElement('i');
          bit.className = 'confetti';
          bit.style.setProperty('--x', `${Math.random() * 100}%`);
          bit.style.setProperty('--c', colors[index % colors.length]);
          bit.style.setProperty('--r', `${Math.random() * 180}deg`);
          bit.style.setProperty('--d', `${.8 + Math.random() * .8}s`);
          celebrate.appendChild(bit);
        }
        celebrate.classList.remove('hidden');
        addTimer(() => celebrate.classList.add('hidden'), 1250);
      }

      function hideAllScreens() {
        listenScreen.classList.add('hidden');
        matchScreen.classList.add('hidden');
        pkPanel.classList.add('hidden');
        spellSoloScreen.classList.add('hidden');
        spellPKScreen.classList.add('hidden');
        spellCountdown.classList.add('hidden');
      }

      function startMode(selectedMode) {
        ensureAudio();
        clearTimers();
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        mode = selectedMode;
        raceOver = false;
        hideAllScreens();
        finishOverlay.classList.add('hidden');
        startOverlay.classList.add('hidden');
        app.classList.toggle('wide', selectedMode.includes('pk'));
        if (selectedMode === 'listen') startListen();
        if (selectedMode === 'match') startMatch();
        if (selectedMode === 'listen-pk') startPK('listen');
        if (selectedMode === 'match-pk') startPK('match');
        if (selectedMode === 'spell') startSpellSolo();
        if (selectedMode === 'spell-pk') startSpellPK();
      }

      function startListen() {
        subtitle.textContent = '聽清楚語音，再找出正確的注音符號！';
        listenScreen.classList.remove('hidden');
        listenState = { question: 1, score: 0, target: '', schedule: shuffle(SYMBOLS), locked: false };
        const grid = document.getElementById('listenGrid');
        grid.innerHTML = '';
        SYMBOLS.forEach((symbol, index) => grid.appendChild(makeSymbolButton(symbol, index, answerListen)));
        nextListenQuestion();
      }

      function nextListenQuestion() {
        listenState.locked = false;
        listenState.target = listenState.schedule[listenState.question - 1];
        document.getElementById('listenQuestion').textContent = listenState.question;
        document.getElementById('listenScore').textContent = listenState.score;
        document.getElementById('listenProgress').style.width = `${((listenState.question - 1) / 37) * 100}%`;
        document.getElementById('listenMessage').textContent = '請仔細聽，再點選正確的注音！';
        document.querySelectorAll('#listenGrid .symbol-btn').forEach(card => card.classList.remove('correct', 'wrong'));
        addTimer(() => speakSymbol(listenState.target), 300);
      }

      function answerListen(symbol, card) {
        if (!listenState || listenState.locked) return;
        if (symbol === listenState.target) {
          listenState.locked = true;
          listenState.score++;
          card.classList.add('correct');
          document.getElementById('listenMessage').textContent = '答對了！好棒！';
          playSuccess();
          showCelebration();
          addTimer(() => {
            if (listenState.question >= 37) {
              document.getElementById('listenProgress').style.width = '100%';
              finishSingle('你完成了全部 37 題聽注音點選！');
            } else {
              listenState.question++;
              nextListenQuestion();
            }
          }, 1100);
        } else {
          card.classList.remove('wrong');
          void card.offsetWidth;
          card.classList.add('wrong');
          document.getElementById('listenMessage').textContent = '再聽一次，重新找找看！';
          playWrong();
          addTimer(() => speakSymbol(listenState.target), 350);
        }
      }

      function makeMatchDeck() {
        const selected = shuffle(SYMBOLS).slice(0, 32);
        return shuffle([...selected, ...selected]).map((symbol, index) => ({ id: index, symbol, matched: false }));
      }

      function startMatch() {
        subtitle.textContent = '翻開紙牌，找出相同的注音符號！';
        matchScreen.classList.remove('hidden');
        matchState = { deck: makeMatchDeck(), first: null, second: null, pairs: 0, locked: false };
        renderSingleMatch();
      }

      function renderSingleMatch() {
        document.getElementById('matchPairs').textContent = matchState.pairs;
        document.getElementById('matchProgress').style.width = `${(matchState.pairs / 32) * 100}%`;
        document.getElementById('matchMessage').textContent = '翻開兩張紙牌找找看！';
        const grid = document.getElementById('matchGrid');
        grid.innerHTML = '';
        matchState.deck.forEach((item, index) => {
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'match-card';
          card.textContent = item.symbol;
          card.setAttribute('aria-label', `注音 ${item.symbol}`);
          bindTap(card, () => selectMatchCard(matchState, index, card, null));
          grid.appendChild(card);
        });
      }

      function selectMatchCard(state, index, card, side) {
        if (state.locked || raceOver || state.deck[index].matched || card.classList.contains('selected')) return;
        card.classList.add('selected');
        card.setAttribute('aria-label', `注音 ${state.deck[index].symbol}`);
        tone(510, .08, 'sine', .16);
        if (state.first === null) {
          state.first = { index, card };
          return;
        }
        state.second = { index, card };
        state.locked = true;
        const firstItem = state.deck[state.first.index];
        const secondItem = state.deck[state.second.index];
        if (firstItem.symbol === secondItem.symbol) {
          firstItem.matched = true;
          secondItem.matched = true;
          playSuccess();
          addTimer(() => {
            state.first.card.classList.remove('selected');
            state.second.card.classList.remove('selected');
            state.first.card.classList.add('matched');
            state.second.card.classList.add('matched');
            state.pairs++;
            state.first = null;
            state.second = null;
            state.locked = false;
            if (side) {
              updatePKMatch(side);
              if (state.pairs >= 32) {
                sides[side].querySelector('.pk-message').textContent = '全部配對完成！';
                addTimer(() => finishPK(side), 600);
              }
            } else {
              document.getElementById('matchPairs').textContent = state.pairs;
              document.getElementById('matchProgress').style.width = `${(state.pairs / 32) * 100}%`;
              document.getElementById('matchMessage').textContent = '配對成功！繼續找下一組！';
              if (state.pairs >= 32) {
                document.getElementById('matchMessage').textContent = '全部配對完成！';
                addTimer(() => finishSingle('你完成了 32 組注音配對！'), 600);
              }
            }
          }, 330);
        } else {
          playWrong();
          addTimer(() => {
            state.first.card.classList.remove('selected');
            state.second.card.classList.remove('selected');
            state.first = null;
            state.second = null;
            state.locked = false;
            if (side) sides[side].querySelector('.pk-message').textContent = '不一樣，再找找看！';
            else document.getElementById('matchMessage').textContent = '不一樣，再找找看！';
          }, 680);
        }
      }

      function startPK(type) {
        subtitle.textContent = type === 'listen' ? '聽注音點選 PK賽｜左右共同搶答 10 題！' : '注音對對碰 PK賽｜左右各 8×8！';
        pkPanel.classList.remove('hidden');
        pkState = { type, left: null, right: null, shared: null };
        if (type === 'listen') {
          const schedule = shuffle(SYMBOLS).slice(0, 10);
          pkState.shared = { question: 1, target: schedule[0], schedule, locked: true };
        }
        ['left', 'right'].forEach(side => {
          const panel = sides[side];
          panel.classList.remove('winner', 'loser');
          panel.querySelectorAll('.winner-banner').forEach(item => item.remove());
          const speakButton = panel.querySelector('.pk-speak');
          speakButton.classList.toggle('hidden', type !== 'listen');
          speakButton.disabled = true;
          panel.querySelector('.pk-message').textContent = '準備開始！';
          if (type === 'listen') setupPKListen(side);
          else setupPKMatch(side);
        });
        runCountdown(() => {
          if (type === 'listen') {
            pkState.shared.locked = false;
            sides.left.querySelector('.pk-speak').disabled = false;
            sides.right.querySelector('.pk-speak').disabled = false;
            sides.left.querySelector('.pk-message').textContent = '請聽題目，搶先作答！';
            sides.right.querySelector('.pk-message').textContent = '請聽題目，搶先作答！';
            speakPKQuestion();
          } else {
            pkState.left.locked = false;
            pkState.right.locked = false;
            sides.left.querySelector('.pk-message').textContent = '開始配對！';
            sides.right.querySelector('.pk-message').textContent = '開始配對！';
          }
        });
      }

      function setupPKListen(side) {
        const state = { score: 0 };
        pkState[side] = state;
        const panel = sides[side];
        panel.querySelector('.pk-status').textContent = '第 1／10 題｜0 分';
        const board = panel.querySelector('.pk-board');
        board.className = 'pk-board pk-listen-grid';
        board.innerHTML = '';
        SYMBOLS.forEach((symbol, index) => board.appendChild(makeSymbolButton(symbol, index, (value, card) => answerPKListen(side, value, card))));
      }

      function speakPKSide(side) {
        if (side !== 'left' && side !== 'right') return;
        speakPKQuestion();
      }

      function speakPKQuestion() {
        if (!pkState || pkState.type !== 'listen' || raceOver) return;
        speakSymbol(pkState.shared.target);
      }

      function answerPKListen(side, symbol, card) {
        const shared = pkState && pkState.shared;
        if (!shared || shared.locked || raceOver) return;
        if (symbol === shared.target) {
          shared.locked = true;
          pkState[side].score++;
          card.classList.add('correct');
          const otherSide = side === 'left' ? 'right' : 'left';
          sides[side].querySelector('.pk-message').textContent = '搶答成功！得到 1 分！';
          sides[otherSide].querySelector('.pk-message').textContent = '對方搶答成功，準備下一題！';
          ['left', 'right'].forEach(player => {
            sides[player].querySelector('.pk-status').textContent = `第 ${shared.question}／10 題｜${pkState[player].score} 分`;
          });
          playSuccess();
          addTimer(() => {
            if (raceOver) return;
            if (shared.question >= 10) {
              finishPKByScore();
              return;
            }
            shared.question++;
            shared.target = shared.schedule[shared.question - 1];
            ['left', 'right'].forEach(player => {
              sides[player].querySelector('.pk-status').textContent = `第 ${shared.question}／10 題｜${pkState[player].score} 分`;
              sides[player].querySelectorAll('.symbol-btn').forEach(item => item.classList.remove('correct', 'wrong'));
              sides[player].querySelector('.pk-message').textContent = '請聽新的共同題目！';
            });
            shared.locked = false;
            speakPKQuestion();
          }, 650);
        } else {
          card.classList.remove('wrong');
          void card.offsetWidth;
          card.classList.add('wrong');
          sides[side].querySelector('.pk-message').textContent = '再聽一次，重新找找看！';
          playWrong();
          addTimer(speakPKQuestion, 300);
        }
      }

      function setupPKMatch(side) {
        const state = { deck: makeMatchDeck(), first: null, second: null, pairs: 0, locked: true };
        pkState[side] = state;
        const panel = sides[side];
        panel.querySelector('.pk-status').textContent = '完成 0／32 組';
        const board = panel.querySelector('.pk-board');
        board.className = 'pk-board pk-match-grid';
        board.innerHTML = '';
        state.deck.forEach((item, index) => {
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'match-card';
          card.textContent = item.symbol;
          card.setAttribute('aria-label', `注音 ${item.symbol}`);
          bindTap(card, () => selectMatchCard(state, index, card, side));
          board.appendChild(card);
        });
      }

      function updatePKMatch(side) {
        const state = pkState[side];
        sides[side].querySelector('.pk-status').textContent = `完成 ${state.pairs}／32 組`;
        sides[side].querySelector('.pk-message').textContent = '配對成功！繼續找！';
      }

      function runCountdown(onStart) {
        let count = 5;
        const number = countdown.querySelector('.count-number');
        number.classList.remove('start');
        number.textContent = count;
        countdown.classList.remove('hidden');
        countdownTimer = setInterval(() => {
          count--;
          if (count > 0) {
            number.textContent = count;
            tone(440, .12, 'sine', .22);
          } else {
            clearInterval(countdownTimer);
            countdownTimer = null;
            number.textContent = '開始';
            number.classList.add('start');
            playSuccess();
            addTimer(() => {
              countdown.classList.add('hidden');
              if (!raceOver) onStart();
            }, 600);
          }
        }, 1000);
      }

      function finishPKByScore() {
        if (pkState.left.score === pkState.right.score) {
          finishPKTie();
        } else {
          finishPK(pkState.left.score > pkState.right.score ? 'left' : 'right');
        }
      }

      function finishPKTie() {
        if (raceOver) return;
        raceOver = true;
        if (pkState.shared) pkState.shared.locked = true;
        Object.values(sides).forEach(panel => {
          panel.querySelectorAll('button').forEach(button => { button.disabled = true; });
          panel.classList.add('winner');
          const banner = document.createElement('div');
          banner.className = 'winner-banner';
          banner.textContent = '🤝 平手！';
          panel.appendChild(banner);
          panel.querySelector('.pk-message').textContent = `雙方都是 ${pkState.left.score} 分！`;
        });
        playSuccess();
        showCelebration('雙方平手！都好棒！');
      }

      function finishPK(winnerSide) {
        if (raceOver) return;
        raceOver = true;
        const loserSide = winnerSide === 'left' ? 'right' : 'left';
        if (pkState.shared) pkState.shared.locked = true;
        if (pkState.left) pkState.left.locked = true;
        if (pkState.right) pkState.right.locked = true;
        Object.values(sides).forEach(panel => panel.querySelectorAll('button').forEach(button => { button.disabled = true; }));
        sides[winnerSide].classList.add('winner');
        sides[loserSide].classList.add('loser');
        const banner = document.createElement('div');
        banner.className = 'winner-banner';
        banner.textContent = '🏆 獲勝！';
        sides[winnerSide].appendChild(banner);
        sides[winnerSide].querySelector('.pk-message').textContent = '恭喜你先完成！';
        sides[loserSide].querySelector('.pk-message').textContent = '比賽結束';
        playSuccess();
        showCelebration(`${winnerSide === 'left' ? '左方' : '右方'}獲勝！好棒！`);
      }

      function newSpellSelections(question) {
        return question.chars.map(() => ({ sheng:'', jie:'', yun:'', tone:'' }));
      }

      function spellToneSymbol(value) {
        return SPELL_TONES.find(toneItem => toneItem.value === value)?.symbol || '';
      }

      function spellIsCorrect(question, selections) {
        return question.chars.every((charData, index) => {
          const selected = selections[index] || {};
          return (selected.sheng || '') === charData[1] &&
            (selected.jie || '') === charData[2] &&
            (selected.yun || '') === charData[3] &&
            (selected.tone || '一聲') === charData[4];
        });
      }

      function spellKeyboardHTML() {
        const row = (type, label, list) => `<div class="spell-key-row" data-key-group="${type}"><span class="spell-key-label">${label}</span><div class="spell-key-list">${list.map(item => {
          const value = typeof item === 'string' ? item : item.value;
          const text = typeof item === 'string' ? item : item.label;
          return `<button class="spell-key" type="button" data-spell-type="${type}" data-spell-value="${value}">${text}</button>`;
        }).join('')}</div></div>`;
        return row('sheng','聲母',SPELL_SHENG) + row('jie','介母',SPELL_JIE) + row('yun','韻母',SPELL_YUN) + row('tone','聲調',SPELL_TONES);
      }

      function speakSpellText(text) {
        if (!('speechSynthesis' in window)) return false;
        const synth = window.speechSynthesis;
        const request = ++spellVoiceRequest;
        const play = () => {
          if (request !== spellVoiceRequest) return;
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'zh-TW';
          const voice = preferredZhVoice();
          if (voice) utterance.voice = voice;
          utterance.rate = .62;
          utterance.pitch = 1.05;
          utterance.volume = 1;
          synth.resume();
          synth.speak(utterance);
        };
        if (synth.speaking || synth.pending) {
          synth.cancel();
          addTimer(play, 90);
        } else {
          play();
        }
        return true;
      }

      function speakSpellQuestion(word) {
        return speakSpellText(`請拼出，${word}`);
      }

      function spellCharsHTML(question, state) {
        return question.chars.map((charData, index) => {
          const selected = state.selections[index] || {};
          return `<button class="spell-char ${state.active === index ? 'active' : ''}" type="button" data-spell-char="${index}">
            <div class="spell-char-label">${charData[0]}${state.active === index ? ' ✍️' : ''}</div>
            <div class="spell-vertical"><div class="spell-stack">
              <span class="spell-slot">${selected.sheng || ''}</span><span class="spell-slot">${selected.jie || ''}</span><span class="spell-slot">${selected.yun || ''}</span>
            </div><span class="spell-tone">${spellToneSymbol(selected.tone)}</span></div>
          </button>`;
        }).join('');
      }

      function renderSpellSolo() {
        if (!spellState) return;
        const question = spellState.questions[spellState.index];
        spellSoloScreen.innerHTML = `
          <div class="spell-status"><span>第 <b>${spellState.index + 1}</b>／20 題</span><span>多字語詞直式拼音</span><span>得分 <b>${spellState.score}</b> 分</span></div>
          <div class="progress-track"><div class="progress-bar" style="width:${(spellState.index + 1) * 5}%"></div></div>
          <div class="spell-word"><span class="spell-icon">${question.icon}</span><span class="spell-name">${question.name}</span><button class="spell-audio" type="button" data-spell-action="audio">🔊 聽發音</button></div>
          <div class="spell-char-area">${spellCharsHTML(question, spellState)}</div>
          <div class="spell-keyboard">${spellKeyboardHTML()}</div>
          <div class="spell-feedback" role="status">${spellState.message}</div>
          <div class="spell-actions"><button class="spell-clear" type="button" data-spell-action="clear">🗑️ 清除此字</button><button class="spell-submit" type="button" data-spell-action="submit">${spellState.locked ? '➡️ 下一題' : '✨ 送出答案'}</button></div>`;
      }

      function startSpellSolo() {
        subtitle.textContent = '看圖、聽發音，完成多字語詞的直式注音！';
        spellSoloScreen.classList.remove('hidden');
        const questions = shuffle(SPELL_BANK);
        spellState = { questions, index:0, score:0, active:0, selections:newSpellSelections(questions[0]), locked:false, message:'請點選下方注音，完成每一個字！' };
        renderSpellSolo();
        speakSpellQuestion(questions[0].name);
      }

      function handleSpellSolo(control) {
        if (!spellState) return;
        const question = spellState.questions[spellState.index];
        if (control.dataset.spellAction === 'audio') { speakSpellQuestion(question.name); return; }
        if (control.dataset.spellChar !== undefined) { spellState.active = Number(control.dataset.spellChar); renderSpellSolo(); return; }
        if (spellState.locked && control.dataset.spellAction !== 'submit') return;
        if (control.dataset.spellType) {
          const selected = spellState.selections[spellState.active];
          const type = control.dataset.spellType;
          const value = control.dataset.spellValue;
          selected[type] = selected[type] === value ? '' : value;
          if (type === 'tone' && value && spellState.active < spellState.selections.length - 1) spellState.active++;
          renderSpellSolo();
          return;
        }
        if (control.dataset.spellAction === 'clear') {
          spellState.selections[spellState.active] = { sheng:'', jie:'', yun:'', tone:'' };
          renderSpellSolo();
          return;
        }
        if (control.dataset.spellAction === 'submit') {
          if (spellState.locked) {
            spellState.index++;
            if (spellState.index >= spellState.questions.length) {
              finishSingle(`你完成了 20 題拼音挑戰，得到 ${spellState.score} 分！`);
              return;
            }
            const next = spellState.questions[spellState.index];
            spellState.active = 0; spellState.selections = newSpellSelections(next); spellState.locked = false; spellState.message = '請完成每一個字的直式注音！';
            renderSpellSolo(); addTimer(() => speakSpellQuestion(next.name), 250); return;
          }
          if (spellIsCorrect(question, spellState.selections)) {
            spellState.score += 5; spellState.locked = true; spellState.message = '🎉 完全答對了！太棒了！';
            playSuccess(); showCelebration('答對了！好棒！'); renderSpellSolo();
          } else {
            spellState.message = '💪 再試一次，仔細檢查每一個注音！'; playWrong(); renderSpellSolo();
          }
        }
      }

      function renderSpellPKShared() {
        const question = spellPKState.questions[spellPKState.index];
        spellPKShared.innerHTML = `<div class="spell-pk-shared-status">共同題目　第 ${spellPKState.index + 1}／10 題</div>
          <div class="spell-word"><span class="spell-icon">${question.icon}</span><span class="spell-name">${question.name}</span><button class="spell-audio" type="button" data-spell-shared-audio>🔊 聽題目</button></div>`;
      }

      function renderSpellPKSide(side) {
        const state = spellPKState[side];
        const question = spellPKState.questions[spellPKState.index];
        const panel = spellPKSides[side];
        panel.innerHTML = `
          <div class="pk-head"><span class="pk-name">${side === 'left' ? '🔵 左方玩家' : '🔴 右方玩家'}</span><span>得分 <b>${state.score}</b></span></div>
          <div class="spell-char-area">${spellCharsHTML(question, state)}</div>
          <div class="spell-keyboard">${spellKeyboardHTML()}</div>
          <div class="spell-feedback" role="status">${state.message}</div>
          <div class="spell-actions"><button class="spell-clear" type="button" data-spell-action="clear">🗑️ 清除</button><button class="spell-submit" type="button" data-spell-action="submit">✨ 送出答案</button></div>`;
      }

      function loadSpellPKQuestion(locked = false) {
        const question = spellPKState.questions[spellPKState.index];
        spellPKState.roundLocked = locked;
        ['left','right'].forEach(side => {
          const state = spellPKState[side];
          state.active = 0; state.selections = newSpellSelections(question); state.locked = locked;
          state.message = locked ? '準備開始！' : '請完成注音，搶先送出！';
          renderSpellPKSide(side);
        });
        renderSpellPKShared();
      }

      function finishSpellPK() {
        if (spellPKState.over) return;
        spellPKState.over = true; spellPKState.roundLocked = true;
        spellPKState.left.locked = true; spellPKState.right.locked = true;
        const leftScore = spellPKState.left.score; const rightScore = spellPKState.right.score;
        if (leftScore === rightScore) {
          ['left','right'].forEach(side => {
            spellPKSides[side].classList.add('winner');
            const banner = document.createElement('div'); banner.className = 'winner-banner'; banner.textContent = '🤝 平手！'; spellPKSides[side].appendChild(banner);
          });
          playSuccess(); showCelebration('雙方平手！都好棒！');
          return;
        }
        const winnerSide = leftScore > rightScore ? 'left' : 'right';
        const loserSide = winnerSide === 'left' ? 'right' : 'left';
        spellPKSides[winnerSide].classList.add('winner'); spellPKSides[loserSide].classList.add('loser');
        const banner = document.createElement('div'); banner.className = 'winner-banner'; banner.textContent = '🏆 獲勝！'; spellPKSides[winnerSide].appendChild(banner);
        playSuccess(); showCelebration(`${winnerSide === 'left' ? '左方' : '右方'}獲勝！好棒！`);
      }

      function handleSpellPK(side, control) {
        const state = spellPKState?.[side];
        if (!state || state.locked || spellPKState.roundLocked || spellPKState.over) return;
        const question = spellPKState.questions[spellPKState.index];
        if (control.dataset.spellChar !== undefined) { state.active = Number(control.dataset.spellChar); renderSpellPKSide(side); return; }
        if (control.dataset.spellType) {
          const selected = state.selections[state.active]; const type = control.dataset.spellType; const value = control.dataset.spellValue;
          selected[type] = selected[type] === value ? '' : value;
          if (type === 'tone' && value && state.active < state.selections.length - 1) state.active++;
          renderSpellPKSide(side); return;
        }
        if (control.dataset.spellAction === 'clear') { state.selections[state.active] = { sheng:'', jie:'', yun:'', tone:'' }; renderSpellPKSide(side); return; }
        if (control.dataset.spellAction === 'submit') {
          if (!spellIsCorrect(question, state.selections)) { state.message = '答案不對，快再試一次！'; playWrong(); renderSpellPKSide(side); return; }
          spellPKState.roundLocked = true; spellPKState.left.locked = true; spellPKState.right.locked = true; state.score++;
          spellPKState[side].message = '🎉 你最先答對，得 1 分！';
          spellPKState[side === 'left' ? 'right' : 'left'].message = '這題由對方先答對！';
          renderSpellPKSide('left'); renderSpellPKSide('right'); playSuccess(); showCelebration(`${side === 'left' ? '左方' : '右方'}搶答成功！`);
          addTimer(() => {
            if (spellPKState.over) return;
            if (spellPKState.index >= 9) finishSpellPK();
            else { spellPKState.index++; loadSpellPKQuestion(false); addTimer(() => speakSpellQuestion(spellPKState.questions[spellPKState.index].name), 180); }
          }, 850);
        }
      }

      function runSpellCountdown() {
        const number = spellCountdown.querySelector('.count-number');
        let count = 5; number.classList.remove('start'); number.textContent = count; spellCountdown.classList.remove('hidden');
        countdownTimer = setInterval(() => {
          count--;
          if (count > 0) number.textContent = count;
          else {
            clearInterval(countdownTimer); countdownTimer = null; number.textContent = '開始'; number.classList.add('start'); playSuccess();
            addTimer(() => { spellCountdown.classList.add('hidden'); if (!spellPKState || spellPKState.over) return; spellPKState.roundLocked = false; ['left','right'].forEach(side => { spellPKState[side].locked = false; spellPKState[side].message = '請完成注音，搶先送出！'; renderSpellPKSide(side); }); speakSpellQuestion(spellPKState.questions[0].name); }, 650);
          }
        }, 1000);
      }

      function startSpellPK() {
        subtitle.textContent = '拼音 PK賽｜共同搶答 10 題，每題先答對者得分！';
        spellPKScreen.classList.remove('hidden');
        Object.values(spellPKSides).forEach(panel => { panel.classList.remove('winner','loser'); panel.querySelectorAll('.winner-banner').forEach(item => item.remove()); });
        const questions = shuffle(SPELL_BANK).slice(0, 10);
        spellPKState = { questions, index:0, over:false, roundLocked:true, left:{ score:0, active:0, selections:[], locked:true, message:'準備開始！' }, right:{ score:0, active:0, selections:[], locked:true, message:'準備開始！' } };
        loadSpellPKQuestion(true);
        speakSpellText('準備開始，倒數五秒');
        runSpellCountdown();
      }

      function bindSpellControls(panel, side = null) {
        const findControl = target => target.closest('[data-spell-char], [data-spell-type], [data-spell-action]');
        panel.addEventListener('pointerdown', event => {
          if (event.pointerType !== 'touch' && event.pointerType !== 'pen') return;
          const control = findControl(event.target); if (!control) return; event.preventDefault(); control.dataset.spellTouch = String(Date.now());
          side ? handleSpellPK(side, control) : handleSpellSolo(control);
        });
        panel.addEventListener('click', event => {
          const control = findControl(event.target); if (!control) return;
          if (event.detail !== 0 && Date.now() - Number(control.dataset.spellTouch || 0) < 700) return;
          side ? handleSpellPK(side, control) : handleSpellSolo(control);
        });
      }

      function finishSingle(text) {
        finishText.textContent = text;
        finishOverlay.classList.remove('hidden');
        playSuccess();
      }

      function showHome() {
        clearTimers();
        raceOver = true;
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        countdown.classList.add('hidden');
        celebrate.classList.add('hidden');
        finishOverlay.classList.add('hidden');
        hideAllScreens();
        app.classList.remove('wide');
        subtitle.textContent = '聽一聽、找一找，一起認識注音符號！';
        Object.values(sides).forEach(panel => {
          panel.classList.remove('winner', 'loser');
          panel.querySelectorAll('.winner-banner').forEach(item => item.remove());
        });
        Object.values(spellPKSides).forEach(panel => {
          panel.classList.remove('winner', 'loser');
          panel.querySelectorAll('.winner-banner').forEach(item => item.remove());
        });
        startOverlay.classList.remove('hidden');
      }

      bindSpellControls(spellSoloScreen);
      bindSpellControls(spellPKSides.left, 'left');
      bindSpellControls(spellPKSides.right, 'right');
      let spellSharedTouchedAt = 0;
      spellPKShared.addEventListener('pointerdown', event => {
        if ((event.pointerType !== 'touch' && event.pointerType !== 'pen') || !event.target.closest('[data-spell-shared-audio]')) return;
        event.preventDefault(); spellSharedTouchedAt = Date.now();
        if (spellPKState && !spellPKState.over) speakSpellQuestion(spellPKState.questions[spellPKState.index].name);
      });
      spellPKShared.addEventListener('click', event => {
        if (!event.target.closest('[data-spell-shared-audio]')) return;
        if (event.detail !== 0 && Date.now() - spellSharedTouchedAt < 700) return;
        if (spellPKState && !spellPKState.over) speakSpellQuestion(spellPKState.questions[spellPKState.index].name);
      });
      document.querySelectorAll('.mode-btn').forEach(button => button.addEventListener('click', () => startMode(button.dataset.mode)));
      document.getElementById('homeTop').addEventListener('click', showHome);
      document.getElementById('finishHome').addEventListener('click', showHome);
      document.getElementById('againBtn').addEventListener('click', () => startMode(mode));
      document.getElementById('listenSpeak').addEventListener('click', () => {
        ensureAudio();
        if (listenState) speakSymbol(listenState.target);
      });
      sides.left.querySelector('.pk-speak').addEventListener('click', () => speakPKSide('left'));
      sides.right.querySelector('.pk-speak').addEventListener('click', () => speakPKSide('right'));
    })();
  </script>
</body>
</html>
